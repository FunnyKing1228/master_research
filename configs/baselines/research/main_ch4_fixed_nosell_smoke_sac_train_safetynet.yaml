  microgrid_id: 0
  episode_length: 96
  time_step: 0.25
  battery_capacity_kwh: 240.0
  battery_power_kw: 60.0
  battery_charge_power_kw: 60.0
  battery_discharge_power_kw: 60.0
  battery_efficiency: 0.9
  soc_min: 0.2
  soc_max: 0.8
