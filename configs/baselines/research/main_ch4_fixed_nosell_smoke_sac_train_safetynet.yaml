random_seed: 20260629
device: auto
thesis_sim:
  description: Scaled small-commercial microgrid scenario without flow-rate action;
    preserves measured P302 PV/load ratios.
  output_dir: thesis_sim/outputs/scaled_commercial_60kw_noflow
  clean_windows_file: thesis_sim/outputs/clean_windows/<run_id>/clean_windows.csv
  random_start_hours:
  - 8
  - 12
  - 18
  random_initial_soc: true
  multi_day_episode_length: 288
  scenario:
    name: small_commercial_60kw_peak_load
    role: hypothetical scale-up / design-space analysis
    source_dataset: data/processed/thesis_coral_stage1_training_clean_windows.csv
    scaled_dataset: data/processed/thesis_scaled_commercial_60kw_clean_windows.csv
    scaled_dataset_meta: data/processed/thesis_scaled_commercial_60kw_clean_windows_meta.json
    scaling_rule: Scale Solar and Consumption by the same factor so measured PV/load
      ratios and timing are preserved.
    target_peak_load_kw: 60.0
    resulting_peak_pv_kw: 80.3077363896848
    bess_power_kw: 60.0
    bess_capacity_kwh: 240.0
    bess_duration_h_at_rated_power: 4.0
    pump_max_power_kw: 4.8
    pump_max_power_fraction_of_bess_power: 0.08
    evidence_basis:
    - DOE commercial reference/prototype buildings define small and medium commercial
      building archetypes for energy simulation.
    - Small commercial field demonstrations include approximately 75 kW PV and 64.5
      kWh / 29 kW storage.
    - C&I storage sizing commonly uses 2-4 hour batteries for demand-charge and TOU
      applications.
    - Vanadium flow-battery auxiliary/pump loads are often around 8-15% of rated system
      power.
  notes:
  - This scenario is not direct sim-to-real validation of the P302 hardware; it is
    a physically motivated commercial scale-up.
  - PV support / grid demand wording still applies; do not describe the system as
    binary PV-vs-grid switching.
  - Battery discharge remains solo load supply, not partial assist alongside PV/grid.
